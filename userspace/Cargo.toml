[package]
name = "user_app"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
zune-jpeg = { version = "0.4.13", default-features = false }
rusttype = { version = "0.9.3", default-features = true }
png = "0.18.1"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
ed25519-dalek = { version = "2", default-features = false }
sha2 = { version = "0.10", default-features = false }
poly1305 = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
