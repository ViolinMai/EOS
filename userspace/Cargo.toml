[package]
name = "user_app"
version = "0.1.0"
edition = "2021"

[dependencies]
linked_list_allocator = "0.10"
# 💡 مكتبة مجتمع رسمية لفك ضغط Zlib/Deflate تدعم no_std + alloc بنسبة 100%
miniz_oxide = { version = "0.7.4", default-features = false, features = ["with-alloc"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
