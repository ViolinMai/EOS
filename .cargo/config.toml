[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tlinker.ld",
    "-C", "relocation-model=static",
    "-C", "code-model=kernel",
    "-C", "link-arg=-no-pie"
]

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = [
    "-C", "relocation-model=static"
]
